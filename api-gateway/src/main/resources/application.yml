server:
  port: 8080  # API Gateway będzie działać na porcie 8080

spring:
  application:
    name: api-gateway  # Nazwa mikroserwisu dla Eureka
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true  # Automatyczne wykrywanie mikroserwisów z Eureka
          lower-case-service-id: true  # ID usług w małych literach
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**

        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/api/products/**

        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/orders/**

        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/payments/**

        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/  # Adres serwera Eureka
